<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erioni Delivery — Dispatch Control</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0ea5e9" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #070b14;
      color: #f8fafc;
      overflow: hidden;
    }
    header {
      height: 58px;
      padding: 0 18px;
      background: #0c1322;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand {
      font-weight: 900;
      font-size: 16px;
      color: #f8fafc;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: -0.2px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      color: #041016;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-ghost {
      background: #131d31;
      color: #cbd5e1;
      border: 1px solid #24334d;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12.5px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      color: #041016;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12.5px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 330px 1fr 340px;
      height: calc(100vh - 58px);
    }
    @media (max-width: 1050px) {
      body { overflow: auto; }
      .app-shell {
        grid-template-columns: 1fr;
        height: auto;
      }
      #adminMap { height: 390px; }
    }

    .left-panel, .right-panel {
      background: #0a101d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .left-panel { border-right: 1px solid #1e293b; }
    .right-panel { border-left: 1px solid #1e293b; }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #172236;
    }
    .kpi {
      background: #10192b;
      border: 1px solid #1e293b;
      border-radius: 11px;
      padding: 8px 10px;
    }
    .kpi-val {
      font-size: 16px;
      font-weight: 900;
      color: #f8fafc;
    }
    .kpi-lbl {
      font-size: 10.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 2px;
    }

    .filter-area {
      padding: 10px 12px;
      border-bottom: 1px solid #172236;
    }
    .search-in {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #24334d;
      background: #070b14;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .tabs {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #10192b;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(14, 165, 233, 0.16);
      border-color: #0ea5e9;
      color: #7dd3fc;
    }

    .task-list {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .task-item {
      background: #10192b;
      border: 1px solid #1e293b;
      border-left: 4px solid #0ea5e9;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .task-item:hover {
      transform: translateY(-1px);
      border-color: #38bdf8;
    }
    .task-item.selected {
      background: #14223a;
      border-color: #38bdf8;
    }
    .task-item.done {
      border-left-color: #10b981;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .item-code {
      font-weight: 900;
      font-size: 13.5px;
      color: #7dd3fc;
    }
    .item-badge {
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.15);
      color: #7dd3fc;
    }
    .task-item.done .item-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
    .item-meta {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 3px;
    }

    #adminMap {
      width: 100%;
      height: 100%;
      min-height: 360px;
    }

    .detail-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }
    .detail-title {
      font-size: 18px;
      font-weight: 900;
      margin: 0 0 4px;
    }
    .detail-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .info-card {
      background: #10192b;
      border: 1px solid #1e293b;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      padding: 5px 0;
      border-bottom: 1px solid #182338;
    }
    .info-row:last-child { border-bottom: none; }
    .info-k { color: #94a3b8; font-weight: 700; }
    .info-v { color: #f8fafc; font-weight: 800; text-align: right; }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .act-btn {
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #24334d;
      background: #131e33;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .act-btn:hover { border-color: #38bdf8; }
    .act-btn.green {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }
    .toast-note {
      margin-top: 10px;
      font-size: 12px;
      color: #6ee7b7;
      font-weight: 800;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <a class="brand" href="/">
        <span class="logo-badge">ED</span>
        <span>Erioni Delivery</span>
      </a>
      <span class="live-pill"><span class="dot"></span> DISPATCH LIVE</span>
    </div>
    <div class="hdr-actions">
      <a class="btn-ghost" href="/biznesi.html">+ Porosi e Re</a>
      <a class="btn-primary" href="/korrieri.html?porosia=ED-205&lat=42.3702&lng=21.1483&nr=Nr.%2014">Hap Korrierin</a>
    </div>
  </header>

  <div class="app-shell">
    <aside class="left-panel">
      <div class="kpi-strip">
        <div class="kpi">
          <div class="kpi-val" id="kpiTotal">0</div>
          <div class="kpi-lbl">Gjithsej</div>
        </div>
        <div class="kpi">
          <div class="kpi-val" id="kpiActive" style="color:#7dd3fc;">0</div>
          <div class="kpi-lbl">Në rrugë</div>
        </div>
        <div class="kpi">
          <div class="kpi-val" id="kpiDone" style="color:#6ee7b7;">0</div>
          <div class="kpi-lbl">Dorëzuar</div>
        </div>
      </div>

      <div class="filter-area">
        <input id="searchBox" class="search-in" type="text" placeholder="Kërko porosinë (p.sh. ED-205)..." oninput="renderList()" />
        <div class="tabs">
          <button id="tabAll" class="tab-btn active" onclick="setFilter('all')">Të gjitha</button>
          <button id="tabActive" class="tab-btn" onclick="setFilter('active')">Aktive</button>
          <button id="tabDone" class="tab-btn" onclick="setFilter('done')">Dorëzuar</button>
        </div>
      </div>

      <div id="taskList" class="task-list">
        <div class="task-item" style="cursor:default;">
          <div class="item-meta" style="margin-top:0;">Në pritje të porosive dhe sinjalit GPS...</div>
        </div>
      </div>
    </aside>

    <main id="adminMap"></main>

    <aside class="right-panel">
      <div id="detailPanel" class="detail-body">
        <h2 class="detail-title">Detajet e Dërgesës</h2>
        <div class="detail-sub">Zgjidh një porosi nga lista ose kliko në hartë për të parë detajet live.</div>

        <div class="info-card">
          <div class="info-row">
            <span class="info-k">Kodi</span>
            <span class="info-v" id="detId">--</span>
          </div>
          <div class="info-row">
            <span class="info-k">Statusi</span>
            <span class="info-v" id="detStatus">--</span>
          </div>
          <div class="info-row">
            <span class="info-k">Koordinatat</span>
            <span class="info-v" id="detCoords">--</span>
          </div>
          <div class="info-row">
            <span class="info-k">Përditësuar</span>
            <span class="info-v" id="detTime">--</span>
          </div>
        </div>

        <div class="action-grid">
          <button class="act-btn" onclick="focusSelected()">Fokuso në Hartë</button>
          <button class="act-btn" onclick="copyClientLink()">Kopjo Link Klienti</button>
          <button class="act-btn" onclick="sendStatusSelected('Rrugës drejt klientit')">Vë në Rrugë</button>
          <button class="act-btn green" onclick="sendStatusSelected('Dorëzuar me sukses')">Shëno Dorëzuar</button>
        </div>

        <div id="detNote" class="toast-note"></div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const adminMap = L.map('adminMap').setView([42.3702, 21.1483], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(adminMap);

    const tasks = {};
    const markers = {};
    let selectedId = null;
    let currentFilter = 'all';

    function ensureTask(id) {
      if (!tasks[id]) {
        tasks[id] = {
          id,
          statusi: 'Në pritje',
          lat: null,
          lng: null,
          perditesuar: '--:--:--'
        };
      }
      if (!selectedId) selectedId = id;
      return tasks[id];
    }

    function setFilter(f) {
      currentFilter = f;
      document.getElementById('tabAll').classList.toggle('active', f === 'all');
      document.getElementById('tabActive').classList.toggle('active', f === 'active');
      document.getElementById('tabDone').classList.toggle('active', f === 'done');
      renderList();
    }

    function isDoneStatus(st) {
      return (st || '').toLowerCase().includes('dorëz');
    }

    function updateKpis() {
      const list = Object.values(tasks);
      const done = list.filter((t) => isDoneStatus(t.statusi)).length;
      document.getElementById('kpiTotal').innerText = list.length;
      document.getElementById('kpiDone').innerText = done;
      document.getElementById('kpiActive').innerText = Math.max(0, list.length - done);
    }

    function renderDetail() {
      const t = selectedId ? tasks[selectedId] : null;
      if (!t) return;

      document.getElementById('detId').innerText = t.id;
      document.getElementById('detStatus').innerText = t.statusi;
      document.getElementById('detCoords').innerText =
        typeof t.lat === 'number' && typeof t.lng === 'number'
          ? `${t.lat.toFixed(5)}, ${t.lng.toFixed(5)}`
          : 'Pa sinjal GPS';
      document.getElementById('detTime').innerText = t.perditesuar;
    }

    function renderList() {
      const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
      const ids = Object.keys(tasks).filter((id) => {
        const t = tasks[id];
        const matchSearch = id.toLowerCase().includes(q) || (t.statusi || '').toLowerCase().includes(q);
        if (!matchSearch) return false;
        if (currentFilter === 'done') return isDoneStatus(t.statusi);
        if (currentFilter === 'active') return !isDoneStatus(t.statusi);
        return true;
      });

      const container = document.getElementById('taskList');
      if (!ids.length) {
        container.innerHTML = '<div class="task-item" style="cursor:default;"><div class="item-meta" style="margin-top:0;">Nuk ka porosi në këtë filtër.</div></div>';
        updateKpis();
        return;
      }

      container.innerHTML = ids
        .map((id) => {
          const t = tasks[id];
          const done = isDoneStatus(t.statusi);
          const sel = id === selectedId;
          const coordsText =
            typeof t.lat === 'number' && typeof t.lng === 'number'
              ? `${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}`
              : 'Në pritje të GPS';
          return `
            <div class="task-item ${done ? 'done' : ''} ${sel ? 'selected' : ''}" onclick="selectTask('${id}')">
              <div class="item-top">
                <span class="item-code">${t.id}</span>
                <span class="item-badge">${t.statusi}</span>
              </div>
              <div class="item-meta">GPS: ${coordsText}</div>
              <div class="item-meta">Ora: ${t.perditesuar}</div>
            </div>
          `;
        })
        .join('');

      updateKpis();
      renderDetail();
    }

    function selectTask(id) {
      selectedId = id;
      renderList();
      focusSelected();
    }

    function focusSelected() {
      const t = selectedId ? tasks[selectedId] : null;
      if (t && typeof t.lat === 'number' && typeof t.lng === 'number') {
        adminMap.setView([t.lat, t.lng], 15);
      }
    }

    function copyClientLink() {
      const t = selectedId ? tasks[selectedId] : null;
      if (!t) return;
      const lat = typeof t.lat === 'number' ? t.lat : 42.3702;
      const lng = typeof t.lng === 'number' ? t.lng : 21.1483;
      const url = `${window.location.origin}/klienti.html?porosia=${encodeURIComponent(t.id)}&lat=${lat}&lng=${lng}`;
      navigator.clipboard.writeText(url).then(() => {
        document.getElementById('detNote').innerText = 'Linku i klientit u kopjua!';
      });
    }

    function sendStatusSelected(statusi) {
      if (!selectedId) return;
      socket.emit('ndrysho-statusin', { porosia: selectedId, statusi });
      const t = ensureTask(selectedId);
      t.statusi = statusi;
      t.perditesuar = new Date().toLocaleTimeString('sq-AL');
      document.getElementById('detNote').innerText = `Statusi u dërgua: ${statusi}`;
      renderList();
    }

    socket.on('perditeso-koordinatat', (data) => {
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;
      const id = data.porosia || 'ED-205';
      const t = ensureTask(id);
      t.lat = data.lat;
      t.lng = data.lng;
      t.perditesuar = new Date().toLocaleTimeString('sq-AL');

      if (!markers[id]) {
        markers[id] = L.marker([data.lat, data.lng]).addTo(adminMap).bindPopup(`${id}`);
      } else {
        markers[id].setLatLng([data.lat, data.lng]);
      }
      renderList();
    });

    socket.on('statusi-ri', (data) => {
      if (!data) return;
      if (typeof data === 'string') {
        const t = ensureTask(selectedId || 'ED-205');
        t.statusi = data;
        t.perditesuar = new Date().toLocaleTimeString('sq-AL');
      } else if (data.porosia) {
        const t = ensureTask(data.porosia);
        t.statusi = data.statusi || t.statusi;
        t.perditesuar = new Date().toLocaleTimeString('sq-AL');
      }
      renderList();
    });
  </script>
</body>
</html>
