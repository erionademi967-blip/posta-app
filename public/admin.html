<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erioni Delivery — Kontrolli Qendror</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00e5a8" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #060911;
      color: #f8fafc;
    }
    header {
      height: 58px;
      padding: 0 18px;
      background: #0c121e;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .left-hdr {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand {
      font-weight: 900;
      font-size: 16px;
      color: #f8fafc;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot-live {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00e5a8;
      box-shadow: 0 0 10px #00e5a8;
    }
    .stats {
      display: flex;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
    }
    .stat-chip {
      background: #131c2e;
      border: 1px solid #24324d;
      padding: 5px 10px;
      border-radius: 999px;
      color: #cbd5e1;
    }
    .btn-new {
      background: linear-gradient(135deg, #00e5a8, #38bdf8);
      color: #041016;
      text-decoration: none;
      padding: 8px 13px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 13px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 58px);
    }
    @media (max-width: 840px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }
      #adminMap { height: 380px; }
    }
    .sidebar {
      background: #090e18;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-box {
      padding: 12px;
      border-bottom: 1px solid #1a2436;
    }
    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #24324d;
      background: #101726;
      color: #fff;
      font-size: 13px;
    }
    .task-list {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .task-card {
      background: #101726;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .task-card:hover {
      transform: translateY(-2px);
      border-color: #00e5a8;
    }
    .task-card.done { border-left-color: #00e5a8; }
    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .task-id {
      font-weight: 900;
      color: #5ef2c8;
      font-size: 14px;
    }
    .task-status {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
    }
    .task-card.done .task-status {
      background: rgba(0, 229, 168, 0.15);
      color: #5ef2c8;
    }
    .meta {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }
    #adminMap {
      width: 100%;
      height: 100%;
      min-height: 350px;
    }
  </style>
</head>
<body>
  <header>
    <div class="left-hdr">
      <a class="brand" href="/"><span class="dot-live"></span> Erioni Delivery</a>
      <div class="stats">
        <span class="stat-chip" id="countActive">Aktive: 0</span>
        <span class="stat-chip" id="countDone">Dorëzuar: 0</span>
      </div>
    </div>
    <a class="btn-new" href="/biznesi.html">+ Porosi e Re</a>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Kërko kodin e porosisë..." oninput="vizatoListen()" />
      </div>
      <div id="listaPorosive" class="task-list">
        <div class="task-card" style="cursor:default;">
          <div class="meta" style="margin-top:0;">Në pritje të sinjalit live nga korrierët...</div>
        </div>
      </div>
    </aside>
    <div id="adminMap"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const adminMap = L.map('adminMap').setView([42.3702, 21.1483], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(adminMap);

    const porosiState = {};
    const markera = {};

    function siguroPorosine(id) {
      if (!porosiState[id]) {
        porosiState[id] = {
          id,
          statusi: 'Në pritje',
          lat: null,
          lng: null,
          perditesuar: '--:--:--'
        };
      }
      return porosiState[id];
    }

    function perditesoNumrat() {
      const items = Object.values(porosiState);
      const done = items.filter((x) => (x.statusi || '').toLowerCase().includes('dorëz')).length;
      const active = items.length - done;
      document.getElementById('countActive').innerText = `Aktive: ${active}`;
      document.getElementById('countDone').innerText = `Dorëzuar: ${done}`;
    }

    function vizatoListen() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const ids = Object.keys(porosiState).filter((id) => id.toLowerCase().includes(q));
      const box = document.getElementById('listaPorosive');

      if (!ids.length) {
        box.innerHTML = '<div class="task-card" style="cursor:default;"><div class="meta" style="margin-top:0;">Nuk ka porosi që përputhen.</div></div>';
        return;
      }

      box.innerHTML = ids
        .map((id) => {
          const p = porosiState[id];
          const isDone = (p.statusi || '').toLowerCase().includes('dorëz');
          const kord =
            typeof p.lat === 'number' && typeof p.lng === 'number'
              ? `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`
              : 'Pa koordinata GPS ende';
          return `
            <div class="task-card ${isDone ? 'done' : ''}" onclick="fokuso('${id}')">
              <div class="task-top">
                <span class="task-id">${p.id}</span>
                <span class="task-status">${p.statusi}</span>
              </div>
              <div class="meta">GPS: ${kord}</div>
              <div class="meta">Përditësuar: ${p.perditesuar}</div>
            </div>
          `;
        })
        .join('');

      perditesoNumrat();
    }

    function fokuso(id) {
      const p = porosiState[id];
      if (p && typeof p.lat === 'number' && typeof p.lng === 'number') {
        adminMap.setView([p.lat, p.lng], 15);
      }
    }

    socket.on('perditeso-koordinatat', (data) => {
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;
      const id = data.porosia || 'ED-LIVE';
      const p = siguroPorosine(id);
      p.lat = data.lat;
      p.lng = data.lng;
      p.perditesuar = new Date().toLocaleTimeString('sq-AL');

      if (!markera[id]) {
        markera[id] = L.marker([data.lat, data.lng]).addTo(adminMap).bindPopup(`${id} (${p.statusi})`);
      } else {
        markera[id].setLatLng([data.lat, data.lng]);
      }
      vizatoListen();
    });

    socket.on('statusi-ri', (data) => {
      if (!data) return;
      if (typeof data === 'string') {
        const p = siguroPorosine('ED-LIVE');
        p.statusi = data;
        p.perditesuar = new Date().toLocaleTimeString('sq-AL');
      } else if (data.porosia) {
        const p = siguroPorosine(data.porosia);
        p.statusi = data.statusi || p.statusi;
        p.perditesuar = new Date().toLocaleTimeString('sq-AL');
      }
      vizatoListen();
    });
  </script>
</body>
</html>
