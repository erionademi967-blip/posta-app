<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erioni Delivery — Korrieri</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #070a10;
      color: #f8fafc;
    }
    .panel {
      padding: 12px 14px;
      background: #0c121d;
      border-bottom: 1px solid #1e293b;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }
    .nr-tag {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
    }
    .route-info {
      font-size: 12.5px;
      color: #cbd5e1;
      font-weight: 700;
    }
    .btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .status-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    button {
      padding: 11px 8px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
    }
    button.green {
      background: #10b981;
      color: #041016;
    }
    button.red { background: #dc2626; }
    button.dark { background: #1e293b; }
    #info {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }
    #map {
      height: calc(100vh - 192px);
      min-height: 320px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top-row">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span id="porosiBadge" class="badge">Porosia: ED-205</span>
        <span id="nrBadge" class="nr-tag" style="display:none;"></span>
      </div>
      <span id="routeSummary" class="route-info">Rruga: -- km • -- min</span>
    </div>

    <div class="btns">
      <button class="green" onclick="nisesGps()">Nis GPS Live</button>
      <button class="red" onclick="ndaloGps()">Ndalo</button>
      <button class="dark" onclick="simuloLevjzje()">Simulo Rrugën</button>
    </div>

    <div class="status-btns">
      <button onclick="dergoStatus('U nis nga posta')">U nis</button>
      <button onclick="dergoStatus('Rrugës drejt klientit')">Rrugës</button>
      <button class="green" onclick="dergoStatus('Dorëzuar me sukses')">Dorëzuar</button>
    </div>

    <div id="info">Gati. Lejo GPS-in ose shtyp "Simulo Rrugën" për të parë rrugën drejt klientit.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const porosiaId = (params.get('porosia') || 'ED-205').trim() || 'ED-205';
    const nrShtepise = (params.get('nr') || '').trim();

    const rawLat = parseFloat(params.get('lat'));
    const rawLng = parseFloat(params.get('lng'));
    const destLat = !Number.isNaN(rawLat) ? rawLat : 42.3745;
    const destLng = !Number.isNaN(rawLng) ? rawLng : 21.1515;

    let korrierLat = 42.3655;
    let korrierLng = 21.1450;

    document.getElementById('porosiBadge').innerText = `Porosia: ${porosiaId}`;
    if (nrShtepise) {
      const nrEl = document.getElementById('nrBadge');
      nrEl.innerText = nrShtepise;
      nrEl.style.display = 'inline-block';
    }

    const map = L.map('map').setView([korrierLat, korrierLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const destLabel = nrShtepise ? `Klienti (${nrShtepise})` : 'Destinacioni (Klienti)';
    L.marker([destLat, destLng]).addTo(map).bindPopup(destLabel);
    const korrierMarker = L.marker([korrierLat, korrierLng]).addTo(map).bindPopup('Ti (Korrieri)').openPopup();

    const vijaRruges = L.polyline([[korrierLat, korrierLng], [destLat, destLng]], {
      color: '#38bdf8',
      weight: 5,
      opacity: 0.9
    }).addTo(map);

    let watchId = null;
    let simInterval = null;

    socket.on('connect', () => {
      socket.emit('bashkohu-porosise', porosiaId);
    });

    async function vizatoRrugenKorrierit(lat1, lng1, lat2, lng2) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes[0] && data.routes[0].geometry) {
          const pika = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          vijaRruges.setLatLngs(pika);
          const km = (data.routes[0].distance / 1000).toFixed(2);
          const min = Math.max(1, Math.round(data.routes[0].duration / 60));
          document.getElementById('routeSummary').innerText = `Rruga: ${km} km • ~${min} min`;
          return;
        }
      } catch (e) {}
      vijaRruges.setLatLngs([[lat1, lng1], [lat2, lng2]]);
    }

    function perditesoPozicionin(lat, lng) {
      korrierLat = lat;
      korrierLng = lng;
      korrierMarker.setLatLng([lat, lng]);
      map.panTo([lat, lng]);
      vizatoRrugenKorrierit(lat, lng, destLat, destLng);

      socket.emit('koordinata-korrieri', {
        porosia: porosiaId,
        lat,
        lng
      });

      document.getElementById('info').innerText =
        `Live: ${lat.toFixed(5)}, ${lng.toFixed(5)} -> Destinacioni: ${destLat.toFixed(5)}, ${destLng.toFixed(5)}`;
    }

    function nisesGps() {
      if (!navigator.geolocation) {
        document.getElementById('info').innerText = 'GPS nuk mbështetet në këtë pajisje.';
        return;
      }
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
      }
      if (watchId !== null) return;

      dergoStatus('Rrugës drejt klientit');
      watchId = navigator.geolocation.watchPosition(
        (pos) => perditesoPozicionin(pos.coords.latitude, pos.coords.longitude),
        (err) => {
          document.getElementById('info').innerText = `Gabim GPS: ${err.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function ndaloGps() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
      }
      document.getElementById('info').innerText = 'Transmetimi u ndal.';
    }

    function simuloLevjzje() {
      ndaloGps();
      let lat = 42.3655;
      let lng = 21.1450;
      dergoStatus('Rrugës drejt klientit');
      perditesoPozicionin(lat, lng);

      simInterval = setInterval(() => {
        lat += (destLat - lat) * 0.14;
        lng += (destLng - lng) * 0.14;
        perditesoPozicionin(lat, lng);
      }, 1500);
    }

    function dergoStatus(statusi) {
      socket.emit('ndrysho-statusin', {
        porosia: porosiaId,
        statusi
      });
      document.getElementById('info').innerText = `Statusi u dërgua: ${statusi}`;
    }

    vizatoRrugenKorrierit(korrierLat, korrierLng, destLat, destLng);
  </script>
</body>
</html>
