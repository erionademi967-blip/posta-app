<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paneli i Korrierit</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #fff; text-align: center; }
    button { display: block; width: 100%; max-width: 340px; margin: 10px auto; padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
    .btn-gps { background: #16a34a; color: #fff; }
    .btn-test { background: #2563eb; color: #fff; }
    .btn-status { background: #334155; color: #fff; }
    #info { margin-top: 20px; font-size: 15px; color: #38bdf8; }
  </style>
</head>
<body>
  <h2>Paneli i Korrierit</h2>

  <button class="btn-gps" onclick="filloGjurmimin()">Fillo Dërgesën (Dërgo GPS)</button>
  <button class="btn-test" onclick="testoPozicionin()">Testo Pozicionin</button>

  <button class="btn-status" onclick="ndryshoStatusin('Porosia u mor')">Porosia u mor</button>
  <button class="btn-status" onclick="ndryshoStatusin('Rrugës drejt jush')">Rrugës drejt jush</button>
  <button class="btn-status" onclick="ndryshoStatusin('U dorëzua')">U dorëzua</button>

  <p id="info">Në pritje të veprimit...</p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let watchId = null;
const params = new URLSearchParams(window.location.search);
const porosiaId = (params.get('porosia') || 'KS-101').trim() || 'KS-101';
socket.emit('bashkohu-porosise', porosiaId);
    function dergoKoordinata(lat, lng, burimi) {
      document.getElementById('info').innerText = `Duke dërguar (${burimi}): ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      socket.emit('dergo-koordinatat', { lat, lng, porosiaId });
    }

    function filloGjurmimin() {
      if (!navigator.geolocation) {
        document.getElementById('info').innerText = 'GPS nuk mbështetet në këtë pajisje.';
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      document.getElementById('info').innerText = 'Duke kërkuar lokacionin...';
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          dergoKoordinata(pos.coords.latitude, pos.coords.longitude, 'GPS');
        },
        (err) => {
          document.getElementById('info').innerText = `Gabim lokacioni: ${err.message}`;
        },
        { enableHighAccuracy: false, maximumAge: 5000, timeout: 10000 }
      );
    }

    function testoPozicionin() {
      const lat = 42.3725 + (Math.random() - 0.5) * 0.004;
      const lng = 21.1505 + (Math.random() - 0.5) * 0.004;
      dergoKoordinata(lat, lng, 'test');
    }

    function ndryshoStatusin(statusi) {
      socket.emit('ndrysho-statusin', { statusi, porosiaId });
      document.getElementById('info').innerText = `Statusi u dërgua: ${statusi}`;
    }
  </script>
</body>
</html>
