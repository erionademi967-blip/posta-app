<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erioni Delivery — Gjurmo Porosinë</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00e5a8" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #060911;
      color: #f8fafc;
    }
    .hud {
      padding: 14px;
      background: linear-gradient(180deg, #0d1424 0%, #090e19 100%);
      border-bottom: 1px solid #1e293b;
    }
    .hud-inner {
      max-width: 920px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .brand-mini {
      font-size: 12px;
      font-weight: 900;
      color: #5ef2c8;
      letter-spacing: 0.4px;
    }
    .chips {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .chip {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.32);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .chip-mint {
      background: rgba(0, 229, 168, 0.14);
      color: #5ef2c8;
      border-color: rgba(0, 229, 168, 0.32);
    }
    #statusi {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    #eta {
      font-size: 13.5px;
      color: #93c5fd;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .step {
      background: #101828;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 7px 9px;
      font-size: 11.5px;
      font-weight: 800;
      color: #64748b;
      text-align: center;
    }
    .step.active {
      background: rgba(0, 229, 168, 0.12);
      border-color: rgba(0, 229, 168, 0.45);
      color: #5ef2c8;
    }
    .progres-box {
      width: 100%;
      background: #151f33;
      border-radius: 999px;
      overflow: hidden;
      height: 12px;
      border: 1px solid #24334d;
    }
    .progres-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e5a8, #38bdf8);
      transition: width 0.4s ease;
    }
    .progres-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 7px;
      font-size: 12px;
      color: #5ef2c8;
      font-weight: 800;
    }
    .actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .code-in {
      background: #070a12;
      border: 1px solid #283652;
      color: #fff;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      width: 105px;
    }
    .btn-sm {
      background: #152238;
      border: 1px solid #293b5c;
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-sm:hover {
      border-color: #00e5a8;
    }
    .banner-done {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 229, 168, 0.14);
      border: 1px solid rgba(0, 229, 168, 0.4);
      color: #5ef2c8;
      font-size: 13px;
      font-weight: 800;
    }
    #map {
      height: calc(100vh - 208px);
      min-height: 340px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-inner">
      <div class="top-bar">
        <span class="brand-mini">ERIONI DELIVERY • GJURMIM LIVE</span>
        <div class="chips">
          <span id="codeChip" class="chip">Porosia: ED-205</span>
          <span id="nrChip" class="chip chip-mint" style="display:none;"></span>
        </div>
      </div>

      <div id="statusi">Statusi: Duke u përgatitur për dërgesë...</div>
      <div id="eta">Distanca: -- km | Arrin për rreth: -- min</div>

      <div class="steps">
        <div id="step1" class="step active">1. U nis nga posta</div>
        <div id="step2" class="step">2. Rrugës te ju</div>
        <div id="step3" class="step">3. Dorëzuar</div>
      </div>

      <div class="progres-box">
        <div id="progresBar" class="progres-bar"></div>
      </div>

      <div class="progres-meta">
        <span id="progresTekst">Progresi: 0%</span>
        <div class="actions">
          <input id="switchInput" class="code-in" type="text" placeholder="Kodi" />
          <button class="btn-sm" onclick="nderroniPorosine()">Ndrysho</button>
          <button class="btn-sm" onclick="fokusoRrugen()">Shiko Rrugën</button>
        </div>
      </div>

      <div id="bannerDone" class="banner-done">
        Dërgesa përfundoi me sukses! Faleminderit për besimin te Erioni Delivery.
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const porosiaId = (params.get('porosia') || 'ED-205').trim() || 'ED-205';
    const nrShtepise = (params.get('nr') || '').trim();

    document.getElementById('codeChip').innerText = `Porosia: ${porosiaId}`;
    document.getElementById('switchInput').value = porosiaId;
    if (nrShtepise) {
      const nrChip = document.getElementById('nrChip');
      nrChip.innerText = nrShtepise;
      nrChip.style.display = 'inline-block';
    }

    const rawLat = parseFloat(params.get('lat'));
    const rawLng = parseFloat(params.get('lng'));
    const klientLat = !Number.isNaN(rawLat) ? rawLat : 42.3702;
    const klientLng = !Number.isNaN(rawLng) ? rawLng : 21.1483;

    let currentCourierLat = 42.3655;
    let currentCourierLng = 21.1450;
    let distancaFillestareKm = null;

    const map = L.map('map').setView([klientLat, klientLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const klientPopup = nrShtepise ? `Destinacioni (${nrShtepise})` : 'Destinacioni juaj';
    L.marker([klientLat, klientLng]).addTo(map).bindPopup(klientPopup).openPopup();
    const korrierMarker = L.marker([currentCourierLat, currentCourierLng]).addTo(map).bindPopup('Korrieri');

    const vijadruges = L.polyline([[currentCourierLat, currentCourierLng], [klientLat, klientLng]], {
      color: '#00e5a8',
      weight: 5,
      opacity: 0.92
    }).addTo(map);

    function aktivizoHap(nr) {
      document.getElementById('step1').classList.toggle('active', nr >= 1);
      document.getElementById('step2').classList.toggle('active', nr >= 2);
      document.getElementById('step3').classList.toggle('active', nr >= 3);
    }

    function nderroniPorosine() {
      const kodiRi = (document.getElementById('switchInput').value || '').trim();
      if (!kodiRi) return;
      const url = new URL(window.location.href);
      url.searchParams.set('porosia', kodiRi);
      window.location.href = url.toString();
    }

    function fokusoRrugen() {
      map.fitBounds([
        [currentCourierLat, currentCourierLng],
        [klientLat, klientLng]
      ], { padding: [36, 36] });
    }

    function llogaritMinutat(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distancaKm = R * c * 1.25;
      const minuta = Math.max(1, Math.round((distancaKm / 30) * 60));
      return { distancaKm, minuta };
    }

    async function perditesoRrugen(lat1, lng1, lat2, lng2) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes[0] && data.routes[0].geometry) {
          const pika = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          vijadruges.setLatLngs(pika);

          const distKm = data.routes[0].distance / 1000;
          const minRruge = Math.max(1, Math.round(data.routes[0].duration / 60));

          if (distancaFillestareKm === null || distKm > distancaFillestareKm) {
            distancaFillestareKm = distKm;
          }

          const progres = Math.max(
            0,
            Math.min(100, Math.round(((distancaFillestareKm - distKm) / distancaFillestareKm) * 100))
          );

          document.getElementById('eta').innerText =
            `Distanca: ${distKm.toFixed(2)} km | Arrin për rreth: ${minRruge} min`;
          document.getElementById('progresBar').style.width = `${progres}%`;
          document.getElementById('progresTekst').innerText = `Progresi: ${progres}%`;
          return;
        }
      } catch (err) {}

      vijadruges.setLatLngs([[lat1, lng1], [lat2, lng2]]);
      const info = llogaritMinutat(lat1, lng1, lat2, lng2);
      document.getElementById('eta').innerText =
        `Distanca: ${info.distancaKm.toFixed(2)} km | Arrin për rreth: ${info.minuta} min`;
    }

    socket.on('connect', () => {
      socket.emit('bashkohu-porosise', porosiaId);
    });

    socket.on('perditeso-koordinatat', (data) => {
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;
      currentCourierLat = data.lat;
      currentCourierLng = data.lng;
      korrierMarker.setLatLng([data.lat, data.lng]);
      map.panTo([data.lat, data.lng]);
      aktivizoHap(2);
      perditesoRrugen(data.lat, data.lng, klientLat, klientLng);
    });

    socket.on('statusi-ri', (data) => {
      const teksti = typeof data === 'string' ? data : (data && data.statusi);
      if (!teksti) return;
      document.getElementById('statusi').innerText = `Statusi: ${teksti}`;
      const low = teksti.toLowerCase();
      if (low.includes('rrug')) aktivizoHap(2);
      if (low.includes('dorëz')) {
        aktivizoHap(3);
        document.getElementById('progresBar').style.width = '100%';
        document.getElementById('progresTekst').innerText = 'Progresi: 100%';
        document.getElementById('bannerDone').style.display = 'block';
      }
    });

    perditesoRrugen(currentCourierLat, currentCourierLng, klientLat, klientLng);
  </script>
</body>
</html>
