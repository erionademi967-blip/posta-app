<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gjurmimi i Porosisë</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
    }
    .top-bar {
      padding: 12px 16px;
      background: #1f2937;
      text-align: center;
    }
    #statusi {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    #eta {
      font-size: 14px;
      color: #d1d5db;
    }
    #map {
      height: calc(100vh - 70px);
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div id="statusi">Statusi: Në pritje të korrierit...</div>
    <div id="eta">Distanca: -- km | Arrin për rreth: -- min</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const klientLat = 42.3702;
    const klientLng = 21.1483;

    const map = L.map('map').setView([klientLat, klientLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    L.marker([klientLat, klientLng]).addTo(map).bindPopup('Adresa e Klientit').openPopup();
    const korrierMarker = L.marker([klientLat, klientLng]).addTo(map).bindPopup('Korrieri');

    const vijaRruges = L.polyline([[klientLat, klientLng], [klientLat, klientLng]], {
      color: '#2563eb',
      weight: 4,
      opacity: 0.85
    }).addTo(map);

    function llogaritMinutat(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const distancaKm = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      const shpejtesiaMesatare = 30;
      const minuta = Math.max(1, Math.round((distancaKm / shpejtesiaMesatare) * 60));
      return { distancaKm: distancaKm.toFixed(2), minuta };
    }

    async function perditesoRrugen(lat1, lng1, lat2, lng2) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes[0] && data.routes[0].geometry) {
          const pika = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          vijaRruges.setLatLngs(pika);
          return;
        }
      } catch (err) {
        console.warn('Gabim te rruga OSRM, përdoret vijë e drejtë:', err);
      }

      vijaRruges.setLatLngs([[lat1, lng1], [lat2, lng2]]);
    }
const params = new URLSearchParams(window.location.search);
const porosiaId = (params.get('porosia') || 'KS-101').trim() || 'KS-101';
    socket.on('connect', () => {
      console.log('Klienti u lidh me serverin:', socket.id);
    socket.emit('bashkohu-porosise', porosiaId);});

    socket.on('perditeso-koordinatat', (data) => {
      console.log('Koordinatat e marra:', data);
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;

      korrierMarker.setLatLng([data.lat, data.lng]);
      map.panTo([data.lat, data.lng]);
      perditesoRrugen(data.lat, data.lng, klientLat, klientLng);

      const info = llogaritMinutat(data.lat, data.lng, klientLat, klientLng);
      document.getElementById('eta').innerText = `Distanca: ${info.distancaKm} km | Arrin per rreth: ${info.minuta} min`;
    });

    socket.on('statusi-ri', (statusi) => {
      console.log('Statusi i ri:', statusi);
      document.getElementById('statusi').innerText = `Statusi: ${statusi}`;
    });
  </script>
</body>
</html>
