<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erioni Delivery — Gjurmim i Plotë Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #070a10;
      color: #f8fafc;
    }
    .hud {
      padding: 12px 14px;
      background: #0c121d;
      border-bottom: 1px solid #1e293b;
    }
    .hud-top {
      max-width: 900px;
      margin: 0 auto 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #statusi {
      font-size: 16px;
      font-weight: 900;
      color: #f8fafc;
    }
    .controls-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .code-input {
      background: #070a10;
      border: 1px solid #2b3a55;
      color: #fff;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      width: 115px;
    }
    .mini-btn {
      background: #172236;
      border: 1px solid #2b3a55;
      color: #7dd3fc;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .mini-btn:hover {
      border-color: #38bdf8;
      background: #1d2c46;
    }
    .chip {
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .chip-green {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.35);
    }
    #eta {
      max-width: 900px;
      margin: 0 auto 8px;
      font-size: 13.5px;
      color: #7dd3fc;
      font-weight: 700;
    }
    .progres-wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .progres-box {
      width: 100%;
      background: #172033;
      border-radius: 999px;
      overflow: hidden;
      height: 14px;
      border: 1px solid #263552;
    }
    .progres-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0ea5e9, #10b981);
      transition: width 0.4s ease;
    }
    .progres-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 12px;
      color: #6ee7b7;
      font-weight: 800;
    }
    .delivered-banner {
      display: none;
      max-width: 900px;
      margin: 8px auto 0;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
      font-size: 13px;
      font-weight: 800;
    }
    #map {
      height: calc(100vh - 144px);
      min-height: 340px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-top">
      <div id="statusi">Statusi: Rruga drejt adresës suaj...</div>
      <div class="controls-bar">
        <span id="codeChip" class="chip">Porosia: ED-205</span>
        <span id="nrChip" class="chip chip-green" style="display:none;"></span>
        <input id="switchCodeInput" class="code-input" type="text" placeholder="Kodi p.sh. ED-205" />
        <button class="mini-btn" onclick="nderroniPorosine()">Ndrysho</button>
        <button class="mini-btn" onclick="fokusoRrugen()">Shiko Rrugën</button>
      </div>
    </div>

    <div id="eta">Distanca: -- km | Arrin për rreth: -- min</div>

    <div class="progres-wrap">
      <div class="progres-box">
        <div id="progresBar" class="progres-bar"></div>
      </div>
      <div class="progres-meta">
        <span id="progresTekst">Progresi i rrugës: 0%</span>
        <span>Erioni Delivery • Gjurmim Live</span>
      </div>
    </div>

    <div id="deliveredBanner" class="delivered-banner">
      Porosia është dorëzuar me sukses. Faleminderit që zgjodhët Erioni Delivery!
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const porosiaId = (params.get('porosia') || 'ED-205').trim() || 'ED-205';
    const nrShtepise = (params.get('nr') || '').trim();

    document.getElementById('codeChip').innerText = `Porosia: ${porosiaId}`;
    document.getElementById('switchCodeInput').value = porosiaId;

    if (nrShtepise) {
      const nrChip = document.getElementById('nrChip');
      nrChip.innerText = nrShtepise;
      nrChip.style.display = 'inline-block';
    }

    const rawLat = parseFloat(params.get('lat'));
    const rawLng = parseFloat(params.get('lng'));
    const klientLat = !Number.isNaN(rawLat) ? rawLat : 42.3702;
    const klientLng = !Number.isNaN(rawLng) ? rawLng : 21.1483;

    let currentCourierLat = 42.3655;
    let currentCourierLng = 21.1450;
    let distancaFillestareKm = null;

    const map = L.map('map').setView([klientLat, klientLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const klientPopup = nrShtepise ? `Adresa e Klientit (${nrShtepise})` : 'Adresa e Klientit';
    L.marker([klientLat, klientLng]).addTo(map).bindPopup(klientPopup).openPopup();
    const korrierMarker = L.marker([currentCourierLat, currentCourierLng]).addTo(map).bindPopup('Korrieri');

    const vijadruges = L.polyline([[currentCourierLat, currentCourierLng], [klientLat, klientLng]], {
      color: '#38bdf8',
      weight: 5,
      opacity: 0.92
    }).addTo(map);

    function nderroniPorosine() {
      const kodiRi = (document.getElementById('switchCodeInput').value || '').trim();
      if (!kodiRi) return;
      const url = new URL(window.location.href);
      url.searchParams.set('porosia', kodiRi);
      window.location.href = url.toString();
    }

    function fokusoRrugen() {
      const bounds = L.latLngBounds([
        [currentCourierLat, currentCourierLng],
        [klientLat, klientLng]
      ]);
      map.fitBounds(bounds, { padding: [36, 36] });
    }

    function llogaritMinutat(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distancaKm = R * c * 1.25;
      const minuta = Math.max(1, Math.round((distancaKm / 30) * 60));
      return { distancaKm, minuta };
    }

    async function perditesoRrugen(lat1, lng1, lat2, lng2) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes[0] && data.routes[0].geometry) {
          const pika = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          vijadruges.setLatLngs(pika);

          const distKm = data.routes[0].distance / 1000;
          const minRruge = Math.max(1, Math.round(data.routes[0].duration / 60));

          if (distancaFillestareKm === null || distKm > distancaFillestareKm) {
            distancaFillestareKm = distKm;
          }

          const progres = Math.max(
            0,
            Math.min(100, Math.round(((distancaFillestareKm - distKm) / distancaFillestareKm) * 100))
          );

          document.getElementById('eta').innerText =
            `Distanca: ${distKm.toFixed(2)} km | Arrin për rreth: ${minRruge} min`;
          document.getElementById('progresBar').style.width = `${progres}%`;
          document.getElementById('progresTekst').innerText = `Progresi i rrugës: ${progres}%`;
          return;
        }
      } catch (err) {
        console.warn('Gabim te rruga OSRM, përdoret vijë e drejtë:', err);
      }

      vijadruges.setLatLngs([[lat1, lng1], [lat2, lng2]]);
      const info = llogaritMinutat(lat1, lng1, lat2, lng2);
      document.getElementById('eta').innerText =
        `Distanca: ${info.distancaKm.toFixed(2)} km | Arrin për rreth: ${info.minuta} min`;
    }

    socket.on('connect', () => {
      socket.emit('bashkohu-porosise', porosiaId);
    });

    socket.on('perditeso-koordinatat', (data) => {
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;
      currentCourierLat = data.lat;
      currentCourierLng = data.lng;
      korrierMarker.setLatLng([data.lat, data.lng]);
      map.panTo([data.lat, data.lng]);
      perditesoRrugen(data.lat, data.lng, klientLat, klientLng);
    });

    socket.on('statusi-ri', (data) => {
      const teksti = typeof data === 'string' ? data : (data && data.statusi);
      if (!teksti) return;
      document.getElementById('statusi').innerText = `Statusi: ${teksti}`;
      if (teksti.toLowerCase().includes('dorëz')) {
        document.getElementById('progresBar').style.width = '100%';
        document.getElementById('progresTekst').innerText = 'Progresi i rrugës: 100%';
        document.getElementById('deliveredBanner').style.display = 'block';
      }
    });

    perditesoRrugen(currentCourierLat, currentCourierLng, klientLat, klientLng);
  </script>
</body>
</html>
