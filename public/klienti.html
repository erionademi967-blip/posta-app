<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gjurmimi i Porosisë</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; margin: 0; }
    #panel { padding: 15px; background: #111; color: #fff; text-align: center; }
    #map { height: 80vh; width: 100%; }
  </style>
</head>
<body>
  <div id="panel">
    <h3 id="statusi">Statusi: Në pritje të korrierit...</h3>
    <p id="eta">Koha e mbetur: Duke llogaritur...</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const klientLat = 42.3702;
    const klientLng = 21.1483;

    const map = L.map('map').setView([klientLat, klientLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    L.marker([klientLat, klientLng]).addTo(map).bindPopup("Adresa e Klientit").openPopup();
    const korrierMarker = L.marker([klientLat, klientLng]).addTo(map).bindPopup("Korrieri");
const vijaRruges = L.polyline([[klientLat, klientLng], [klientLat, klientLng]], { color: '#2563eb', weight: 4, opacity: 0.85 }).addTo(map);
    function llogaritMinutat(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const distancaKm = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      const shpejtesiaMesatare = 30;
      const minuta = Math.max(1, Math.round((distancaKm / shpejtesiaMesatare) * 60));
      return { distancaKm: distancaKm.toFixed(2), minuta };
    }

    socket.on('connect', () => {
      console.log('Klienti u lidh me serverin:', socket.id);
    });

    socket.on('perditeso-koordinatat', (data) => {
      console.log('Koordinatat e marra:', data);
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;

      korrierMarker.setLatLng([data.lat, data.lng]);
      map.panTo([data.lat, data.lng]);
vijaRruges.setLatLngs([[data.lat, data.lng], [klientLat, klientLng]]);
      const info = llogaritMinutat(data.lat, data.lng, klientLat, klientLng);
      document.getElementById('eta').innerText = `Distanca: ${info.distancaKm} km | Arrin për rreth: ${info.minuta} min`;
    });

    socket.on('statusi-ri', (statusi) => {
      console.log('Statusi i ri:', statusi);
      document.getElementById('statusi').innerText = `Statusi: ${statusi}`;
    });
  </script>
</body>
</html>
