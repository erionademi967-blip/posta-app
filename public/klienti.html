<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gjurmimi i Porosisë — Posta Track</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00d2a0" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b0e14;
      color: #f8fafc;
    }
    .hud {
      padding: 12px 14px;
      background: #121722;
      border-bottom: 1px solid #222b3d;
    }
    .hud-top {
      max-width: 820px;
      margin: 0 auto 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .code-chip {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    #statusi {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
    }
    #eta {
      max-width: 820px;
      margin: 0 auto 8px;
      font-size: 13.5px;
      color: #67e8f9;
      font-weight: 600;
    }
    .progres-wrap {
      max-width: 820px;
      margin: 0 auto;
    }
    .progres-box {
      width: 100%;
      background: #1e2636;
      border-radius: 999px;
      overflow: hidden;
      height: 14px;
      border: 1px solid #2f3b52;
    }
    .progres-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.4s ease;
    }
    .progres-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 12px;
      color: #6ee7b7;
      font-weight: 700;
    }
    #map {
      height: calc(100vh - 132px);
      min-height: 340px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-top">
      <div id="statusi">Statusi: Në pritje të korrierit...</div>
      <span id="codeChip" class="code-chip">Porosia: KS-105</span>
    </div>
    <div id="eta">Distanca: -- km | Arrin për rreth: -- min</div>
    <div class="progres-wrap">
      <div class="progres-box">
        <div id="progresBar" class="progres-bar"></div>
      </div>
      <div class="progres-meta">
        <span id="progresTekst">Progresi i rrugës: 0%</span>
        <span>Gjurmim live</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const porosiaId = (params.get('porosia') || 'KS-101').trim() || 'KS-101';
    document.getElementById('codeChip').innerText = `Porosia: ${porosiaId}`;

    const rawLat = parseFloat(params.get('lat'));
    const rawLng = parseFloat(params.get('lng'));
    const klientLat = !Number.isNaN(rawLat) ? rawLat : 42.3702;
    const klientLng = !Number.isNaN(rawLng) ? rawLng : 21.1483;
    let distancaFillestareKm = null;

    const map = L.map('map').setView([klientLat, klientLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    L.marker([klientLat, klientLng]).addTo(map).bindPopup('Adresa e Klientit').openPopup();
    const korrierMarker = L.marker([klientLat, klientLng]).addTo(map).bindPopup('Korrieri');

    const vijadruges = L.polyline([[klientLat, klientLng], [klientLat, klientLng]], {
      color: '#2563eb',
      weight: 4.5,
      opacity: 0.9
    }).addTo(map);

    function llogaritMinutat(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distancaKm = R * c * 1.25;
      const minuta = Math.max(1, Math.round((distancaKm / 30) * 60));
      return { distancaKm, minuta };
    }

    async function perditesoRrugen(lat1, lng1, lat2, lng2) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes[0] && data.routes[0].geometry) {
          const pika = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          vijadruges.setLatLngs(pika);

          const distKm = data.routes[0].distance / 1000;
          const minRruge = Math.max(1, Math.round(data.routes[0].duration / 60));

          if (distancaFillestareKm === null || distKm > distancaFillestareKm) {
            distancaFillestareKm = distKm;
          }

          const progres = Math.max(
            0,
            Math.min(100, Math.round(((distancaFillestareKm - distKm) / distancaFillestareKm) * 100))
          );

          document.getElementById('eta').innerText =
            `Distanca: ${distKm.toFixed(2)} km | Arrin për rreth: ${minRruge} min`;
          document.getElementById('progresBar').style.width = `${progres}%`;
          document.getElementById('progresTekst').innerText = `Progresi i rrugës: ${progres}%`;
          return;
        }
      } catch (err) {
        console.warn('Gabim te rruga OSRM, përdoret vijë e drejtë:', err);
      }

      vijadruges.setLatLngs([[lat1, lng1], [lat2, lng2]]);
      const info = llogaritMinutat(lat1, lng1, lat2, lng2);
      document.getElementById('eta').innerText =
        `Distanca: ${info.distancaKm.toFixed(2)} km | Arrin për rreth: ${info.minuta} min`;
    }

    socket.on('connect', () => {
      socket.emit('bashkohu-porosise', porosiaId);
    });

    socket.on('perditeso-koordinatat', (data) => {
      if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') return;
      korrierMarker.setLatLng([data.lat, data.lng]);
      map.panTo([data.lat, data.lng]);
      perditesoRrugen(data.lat, data.lng, klientLat, klientLng);
    });

    socket.on('statusi-ri', (statusi) => {
      document.getElementById('statusi').innerText = `Statusi: ${statusi}`;
    });
  </script>
</body>
</html>
