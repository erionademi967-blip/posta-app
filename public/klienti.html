<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gjurmimi i Porosisë</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; margin: 0; }
    #panel { padding: 15px; background: #111; color: #fff; text-align: center; }
    #map { height: 80vh; width: 100%; }
  </style>
</head>
<body>
  <div id="panel">
    <h3 id="statusi">Statusi: Në pritje të korrierit...</h3>
    <p id="eta">Koha e mbetur: Duke llogaritur...</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Vendndodhja fikse e klientit (shembull: qendra e qytetit - mund ta ndryshosh)
    const klientLat = 42.3702;
    const klientLng = 21.1483;

    const map = L.map('map').setView([klientLat, klientLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Markeri i klientit
    L.marker([klientLat, klientLng]).addTo(map).bindPopup("Adresa e Klientit (Nr. Shtëpisë 12)").openPopup();

    // Markeri i korrierit
    let korrierMarker = L.marker([klientLat, klientLng]).addTo(map).bindPopup("Korrieri");

    // Llogaritja e distancës dhe minutave të përafërta
    function llogaritMinutat(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const distancaKm = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
      const shpejtesiaMesatare = 30; // 30 km/h në qytet
      const minuta = Math.max(1, Math.round((distancaKm / shpejtesiaMesatare) * 60));
      return { distancaKm: distancaKm.toFixed(2), minuta };
    }

    socket.on('perditeso-koordinatat', (data) => {
      korrierMarker.setLatLng([data.lat, data.lng]);
      map.panTo([data.lat, data.lng]);

      const info = llogaritMinutat(data.lat, data.lng, klientLat, klientLng);
      document.getElementById(`eta`).innerText = `Distanca: ${info.distancaKm} km | Arrini për rreth: ${info.minuta} min`; });

    socket.on('statusi-ri', (statusi) => {
      document.getElementById(`statusi`).innerText = `Statusi: ${statusi}`;
    });
  </script>
</body>
</html>
