<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paneli i Biznesit / Postës</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px 36px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #182232 0%, #0d1017 65%);
      color: #f4f6fb;
      text-align: center;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      background: #161b26;
      border: 1px solid #262f40;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .top-nav a {
      color: #5ef2c8;
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }
    p.sub {
      color: #a3b1c6;
      font-size: 14px;
      margin: 0 0 18px;
      line-height: 1.45;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    input {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #2f3b52;
      background: #0e121a;
      color: #fff;
      width: 220px;
    }
    button {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
    }
    button.green { background: #059669; }
    button.gray { background: #2d3748; }
    .hint {
      font-size: 12px;
      color: #67e8f9;
      margin: 8px 0 6px;
    }
    #pickerMap {
      height: 270px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid #2d3748;
      margin-bottom: 14px;
      cursor: crosshair;
    }
    .link-box {
      background: #10141d;
      border: 1px solid #252e3f;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      text-align: left;
      word-break: break-all;
      font-size: 13px;
    }
    .label {
      color: #67e8f9;
      font-weight: 700;
      margin-bottom: 5px;
      display: block;
    }
    .msg {
      margin-top: 12px;
      color: #5ef2c8;
      font-size: 13px;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00b894" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="top-nav">
      <a href="/">← Faqja Kryesore</a>
      <a href="/admin.html">Kontrolli Qendror →</a>
    </div>

    <h1>Paneli i Biznesit / Postës</h1>
    <p class="sub">Shkruaj kodin e porosisë dhe kliko në hartë (ose ndrysho koordinatat) për të gjeneruar linket.</p>

    <div class="row">
      <input id="porosiaInput" type="text" placeholder="p.sh. KS-105" value="KS-105" />
      <button class="green" onclick="perditesoLinket()">Përditëso Linket</button>
    </div>

    <div class="hint">Kliko mbi hartë për të vendosur pikën e saktë të klientit:</div>
    <div id="pickerMap"></div>

    <div class="row">
      <input id="latInput" type="text" placeholder="Lat p.sh. 42.3702" value="42.3702" oninput="sinkronizoNgaInput()" />
      <input id="lngInput" type="text" placeholder="Lng p.sh. 21.1483" value="21.1483" oninput="sinkronizoNgaInput()" />
    </div>

    <div class="link-box">
      <span class="label">Linku për Klientin:</span>
      <div id="linkKlienti"></div>
      <div class="row" style="margin-top:10px; margin-bottom:0; justify-content:flex-start;">
        <button onclick="kopjo('klient')">Kopjo Linkun</button>
        <button class="gray" onclick="hap('klient')">Hap Klientin</button>
      </div>
    </div>

    <div class="link-box">
      <span class="label">Linku për Korrierin:</span>
      <div id="linkKorrieri"></div>
      <div class="row" style="margin-top:10px; margin-bottom:0; justify-content:flex-start;">
        <button onclick="kopjo('korrier')">Kopjo Linkun</button>
        <button class="gray" onclick="hap('korrier')">Hap Korrierin</button>
      </div>
    </div>

    <div id="mesazhi" class="msg"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const baseUrl = window.location.origin;
    const initialLat = 42.3702;
    const initialLng = 21.1483;

    const pickerMap = L.map('pickerMap').setView([initialLat, initialLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(pickerMap);

    let klientPickerMarker = L.marker([initialLat, initialLng])
      .addTo(pickerMap)
      .bindPopup('Pika e klientit')
      .openPopup();

    function getKodi() {
      const val = document.getElementById('porosiaInput').value.trim();
      return val || 'KS-101';
    }

    function getKoordinatat() {
      const lat = parseFloat(document.getElementById('latInput').value.trim());
      const lng = parseFloat(document.getElementById('lngInput').value.trim());
      return {
        lat: !Number.isNaN(lat) ? lat : initialLat,
        lng: !Number.isNaN(lng) ? lng : initialLng
      };
    }

    function perditesoLinket(mesazh = 'Linket u përditësuan.') {
      const kodi = encodeURIComponent(getKodi());
      const { lat, lng } = getKoordinatat();
      document.getElementById('linkKlienti').innerText =
        `${baseUrl}/klienti.html?porosia=${kodi}&lat=${lat}&lng=${lng}`;
      document.getElementById('linkKorrieri').innerText =
        `${baseUrl}/korrieri.html?porosia=${kodi}&lat=${lat}&lng=${lng}`;
      document.getElementById('mesazhi').innerText = mesazh;
    }

    pickerMap.on('click', (e) => {
      const lat = Number(e.latlng.lat.toFixed(6));
      const lng = Number(e.latlng.lng.toFixed(6));

      document.getElementById('latInput').value = lat;
      document.getElementById('lngInput').value = lng;
      klientPickerMarker.setLatLng([lat, lng]);
      perditesoLinket(`Pika u zgjodh në hartë (${lat}, ${lng}). Linket u përditësuan.`);
    });

    function sinkronizoNgaInput() {
      const { lat, lng } = getKoordinatat();
      klientPickerMarker.setLatLng([lat, lng]);
      pickerMap.panTo([lat, lng]);
      perditesoLinket();
    }

    function kopjo(lloji) {
      const teksti =
        lloji === 'klient'
          ? document.getElementById('linkKlienti').innerText
          : document.getElementById('linkKorrieri').innerText;

      navigator.clipboard.writeText(teksti).then(() => {
        document.getElementById('mesazhi').innerText = 'Linku u kopjua në clipboard!';
      });
    }

    function hap(lloji) {
      const url =
        lloji === 'klient'
          ? document.getElementById('linkKlienti').innerText
          : document.getElementById('linkKorrieri').innerText;

      window.open(url, '_blank');
    }

    perditesoLinket();
  </script>
</body>
</html>
